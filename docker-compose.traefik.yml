# Overlay for servers where Traefik (Docker provider, host network) already owns ports 80/443.
# Use: docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
# Needs APP_HOST in .env (e.g. sheetiq.example.com). Entrypoint/resolver names match the server's Traefik.
services:
  frontend:
    labels:
      - traefik.enable=true
      - traefik.http.routers.sheetiq.rule=Host(`${APP_HOST:?set APP_HOST in .env}`)
      - traefik.http.routers.sheetiq.entrypoints=websecure
      - traefik.http.routers.sheetiq.tls.certresolver=letsencrypt
      - traefik.http.services.sheetiq.loadbalancer.server.port=80
      # Basic Auth for the whole app (frontend + /api). Hash lives only in .env: see scripts/set-basic-auth.sh
      - traefik.http.middlewares.sheetiq-auth.basicauth.users=${BASIC_AUTH_USERS:?run scripts/set-basic-auth.sh first}
      - traefik.http.middlewares.sheetiq-auth.basicauth.removeheader=true
      - traefik.http.routers.sheetiq.middlewares=sheetiq-auth
